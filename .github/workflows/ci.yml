# Validates the same commands Vercel runs locally; push this branch so Git + Vercel can deploy.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test
